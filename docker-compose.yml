
services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}

    image: visitor-log-backend:${APP_VERSION:-1.0.0}
    container_name: visitor-backend
    restart: unless-stopped

    environment:
      PORT: "5000"
      DATA_DIR: /var/lib/backend_data
      DATA_FILE: visitor_logs.json
      APP_VERSION: ${APP_VERSION:-1.0.0}

    volumes:
      - visitor-log-data:/var/lib/backend_data

    expose:
      - "5000"

    ports:
      - "5000:5000"

    networks:
      - app-net

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    image: nginx:1.27-alpine
    container_name: visitor-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

    volumes:
      - ${FRONTEND_DIR:-./frontend}:/usr/share/nginx/html:ro
      - ${FRONTEND_DIR:-./frontend}/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app-net

networks:
  app-net:
    name: app-net
    driver: bridge

volumes:
  visitor-log-data:
    name: visitor-log-data
